name: Terraform Infrastructure

# PR to main: plan only
# Push to main: plan -> approval -> apply
# Manual dispatch: plan, apply, or destroy

on:
  push:
    branches:
      - main
    paths:
      - "envs/dev/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"

  pull_request:
    branches:
      - main
    paths:
      - "envs/dev/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

      confirm_destroy:
        description: 'Type "destroy" to confirm destruction'
        required: false
        default: ""

permissions:
  contents: read

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: us-east-1

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PLAN
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # Skip Plan only for manual destroy
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'destroy'

    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.DEV_JWT_SECRET }}" \
            -var="github_org=${{ vars.GH_ORG }}" \
            -out=tfplan \
            -no-color

      - name: Upload plan file
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: envs/dev/tfplan
          retention-days: 1

  # APPLY
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan

    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')

    # Requires approval if configured in GitHub Environment settings
    environment:
      name: dev

    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Download plan file
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: envs/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan

  # DESTROY
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.confirm_destroy == 'destroy'

    # Approval required before destruction
    environment:
      name: dev

    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.DEV_JWT_SECRET }}" \
            -var="github_org=${{ vars.GH_ORG }}" \
            -auto-approve \
            -no-color
